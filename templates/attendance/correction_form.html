{% extends 'base.html' %}
{% block title %}Request Attendance Correction{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="mb-4">
        <h3 class="fw-bold mb-1">Request Attendance Adjustment</h3>
        <p class="text-muted small mb-0">Submit a correction for missing punch-in or punch-out events with supporting justification.</p>
    </div>

    <div class="hrms-card p-4" style="max-width: 600px;">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold">Date of Occurrence *</label>
                <input type="date" name="date" class="form-control" required>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label small fw-semibold">Correct Punch In Time</label>
                    <input type="time" name="punch_in" class="form-control">
                </div>
                <div class="col-6">
                    <label class="form-label small fw-semibold">Correct Punch Out Time</label>
                    <input type="time" name="punch_out" class="form-control">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold">Reason for Discrepancy *</label>
                <textarea name="reason" rows="3" class="form-control" placeholder="Explain reason for missing or incorrect punch..." required></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'attendance:my_attendance' %}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-hrms px-4">Submit Correction Request</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
