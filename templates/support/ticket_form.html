{% extends 'base.html' %}
{% block title %}Open New Support Ticket{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="mb-4">
        <h3 class="fw-bold mb-1">Open Support Ticket / Workplace Query</h3>
        <p class="text-muted small mb-0">Describe your inquiry or hardware/facilities assistance request for immediate routing to the support team.</p>
    </div>

    <div class="hrms-card p-4" style="max-width: 700px;">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Issue Category *</label>
                    <select name="category" class="form-select" required>
                        <option value="IT_SUPPORT">IT & Hardware / Software Issue</option>
                        <option value="WORKPLACE">Workplace & Facility Request</option>
                        <option value="HR_QUERY">HR Policy & Benefits Query</option>
                        <option value="GRIEVANCE">Confidential Grievance</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Urgency Priority *</label>
                    <select name="priority" class="form-select">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HIGH">High</option>
                        <option value="URGENT">Urgent (System Down / Work Blocking)</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Subject / Title *</label>
                <input type="text" name="subject" class="form-control" placeholder="Brief summary of request..." required>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Detailed Description *</label>
                <textarea name="description" rows="4" class="form-control" placeholder="Provide complete symptoms or details..." required></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Supporting Attachment (Optional Screenshot / Doc)</label>
                <input type="file" name="attachment" class="form-control">
            </div>

            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                <a href="{% url 'support:tickets_list' %}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-hrms px-4">Submit Ticket</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
