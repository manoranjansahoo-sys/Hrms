<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Careers Portal{% endblock %} | Company HRMS</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Identity Services (GIS) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --brand-primary: #1B5E20;
            --brand-secondary: #2E7D32;
            --brand-accent: #F59E0B;
            --brand-light: #F6FAF5;
            --brand-card: #FFFFFF;
            --brand-text: #1F2937;
            --brand-muted: #6B7280;
            --brand-border: #E5E7EB;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--brand-light);
            color: var(--brand-text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .public-navbar {
            background-color: #FFFFFF;
            border-bottom: 1px solid var(--brand-border);
            padding: 0.9rem 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            position: sticky;
            top: 0;
            z-index: 1030;
        }

        .brand-icon-box {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2E7D32, #1B5E20);
            color: #FFFFFF;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 4px 10px rgba(27, 94, 32, 0.2);
        }

        .career-badge {
            background-color: #E8F5E9;
            color: #1B5E20;
            font-weight: 600;
            padding: 0.25rem 0.65rem;
            border-radius: 6px;
            font-size: 0.75rem;
            border: 1px solid #C8E6C9;
        }

        .public-container {
            flex-grow: 1;
            padding: 2rem 1rem;
        }

        .card-custom {
            background: #FFFFFF;
            border: 1px solid var(--brand-border);
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .btn-brand {
            background-color: var(--brand-primary);
            border-color: var(--brand-primary);
            color: #FFFFFF;
            font-weight: 500;
            border-radius: 8px;
            padding: 0.6rem 1.3rem;
            transition: all 0.2s ease;
        }

        .btn-brand:hover {
            background-color: #144818;
            border-color: #144818;
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(27, 94, 32, 0.25);
        }

        /* Stepper Styling */
        .step-indicator {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 2rem;
        }

        .step-indicator::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 25px;
            right: 25px;
            height: 3px;
            background-color: #E5E7EB;
            z-index: 1;
        }

        .step-indicator-progress {
            position: absolute;
            top: 18px;
            left: 25px;
            height: 3px;
            background-color: var(--brand-primary);
            z-index: 2;
            transition: width 0.3s ease;
        }

        .step-item {
            position: relative;
            z-index: 3;
            text-align: center;
            background: #FFFFFF;
            padding: 0 6px;
        }

        .step-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #FFFFFF;
            border: 2px solid #D1D5DB;
            color: #6B7280;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.4rem auto;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .step-item.active .step-circle {
            border-color: var(--brand-primary);
            background-color: var(--brand-primary);
            color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(27, 94, 32, 0.15);
        }

        .step-item.completed .step-circle {
            border-color: var(--brand-secondary);
            background-color: var(--brand-secondary);
            color: #FFFFFF;
        }

        .step-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: #6B7280;
        }

        .step-item.active .step-title {
            color: var(--brand-primary);
        }

        .public-footer {
            background-color: #FFFFFF;
            border-top: 1px solid var(--brand-border);
            padding: 1.5rem;
            margin-top: auto;
            color: var(--brand-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 767.98px) {
            .step-title {
                display: none;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- NAVBAR -->
    <header class="public-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <div class="brand-icon-box">
                    <i class="bi bi-buildings-fill"></i>
                </div>
                <div>
                    <span class="fw-bold fs-5 text-dark">Company HRMS</span>
                    <span class="career-badge ms-2">Official Careers</span>
                </div>
            </div>

            <div class="d-flex align-items-center gap-2">
                <a href="{% url 'recruitment:candidate_track' %}" class="btn btn-outline-success btn-sm">
                    <i class="bi bi-search me-1"></i> Track Application
                </a>
                <a href="{% url 'accounts:login' %}" class="btn btn-light btn-sm border text-muted">
                    <i class="bi bi-box-arrow-in-right"></i> Employee Login
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN BODY -->
    <main class="public-container">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="public-footer">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
                &copy; 2026 Company HRMS Enterprise. Talent Acquisition & People Operations.
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
